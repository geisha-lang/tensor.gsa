name = "tensor"
version = "0.1.0"
src_dir = "src"
tests = ["tests/spec.gsa"]

[target.native]

[[target.native.when]]
os = "macos"
link_flags = ["-framework", "Accelerate"]

[[target.native.when]]
os = "linux"
pkg_config = "openblas"

[[target.native.when]]
tool = "nvcc"
compiler = "nvcc"
c_sources = ["native/cuda.cu"]
defines = ["GS_TENSOR_CUDA"]
c_flags = ["-O3"]
link_flags = ["-lcudart", "-lcublas"]
