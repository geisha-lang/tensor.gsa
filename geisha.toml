name = "tensor"
version = "0.2.0"
src_dir = "src"
tests = ["tests/spec.gsa"]

[target.native]
c_sources = ["native/cuda_weak_stubs.c"]
c_flags = ["-O2"]

[[target.native.when]]
os = "macos"
link_flags = [
    "-framework", "Accelerate",
    "-framework", "Metal",
    "-framework", "MetalPerformanceShaders",
    "-framework", "Foundation",
    "-lobjc"
]

[[target.native.when]]
os = "linux"
c_sources = ["native/metal_stubs_linux.c"]
pkg_config = "openblas"

[[target.native.when]]
tool = "nvcc"
compiler = "nvcc"
c_sources = ["native/cuda.cu"]
defines = ["GS_TENSOR_CUDA"]
c_flags = ["-O3"]
link_flags = ["-L/usr/local/cuda/lib64", "-Wl,-rpath,/usr/local/cuda/lib64", "-lcudart", "-lcublas", "-lstdc++"]
